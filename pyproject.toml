[project]
name = "pixdial"
version = "0.1.0"
description = "A Python SDK and CLI for hardware screens on Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/pixdial/fonts/LICENSE-Lato.txt"]
authors = [{ name = "YordiLorenzo" }]
keywords = ["lcd", "hardware-monitoring", "dashboard", "linux", "lian-li"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.1",
    "cryptography>=43",  # its hazmat.decrepit module (single DES)
]

[project.urls]
Homepage = "https://github.com/YordiLorenzo/pixdial"
Repository = "https://github.com/YordiLorenzo/pixdial"
Issues = "https://github.com/YordiLorenzo/pixdial/issues"

[project.scripts]
pixdial = "pixdial.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixdial"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "RET", "PTH"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # the °, ×, – and · in text and comments are wanted
    "B027",  # a base class's optional hooks (Source.reset, Source.close) are empty on purpose
    "B019",  # cached methods: kits and their rings live as long as the program (kit() keeps one per scale)
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "examples/plugin"]

disable_error_code = ["type-abstract"]  # a plugin kind's abstract base class names what it must subclass

[[tool.mypy.overrides]]
module = ["pixdial.designs.*"]
warn_return_any = false  # numpy's stubs type many array operations as Any

[tool.pytest.ini_options]
testpaths = ["tests"]
